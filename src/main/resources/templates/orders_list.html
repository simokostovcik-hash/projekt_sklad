<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>My Orders | Coffee Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container-fluid { max-width: 1400px; }
        .card { border: none; border-radius: 10px; overflow: hidden; }
        .card-header h3 { font-size: 1.25rem; font-weight: 600; }
        .table-sm-text { font-size: 0.85rem; }
        .badge-status {
            font-size: 0.65rem;
            padding: 0.4em 0.7em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-radius: 20px;
        }
        .empty-state { padding: 4rem 0; }
        .address-box { line-height: 1.2; max-width: 200px; }
        .company-info { font-style: italic; color: #6c757d; border-top: 1px solid #dee2e6; margin-top: 4px; padding-top: 2px; }
    </style>
</head>
<body class="bg-light">

<div class="container-fluid mt-5 px-4">
    <div class="row justify-content-center">
        <div class="col-12">

            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white p-3 d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center">
                        <span class="fs-4 me-2">📑</span>
                        <h3 class="mb-0">Order History & Shipping Details</h3>
                    </div>
                    <div>
                        <a th:href="@{/coffee/all}" class="btn btn-outline-info btn-sm">
                            ← Back to Inventory
                        </a>
                    </div>
                </div>

                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0 table-sm-text">
                            <thead class="table-light text-secondary text-uppercase small">
                            <tr>
                                <th class="ps-4">ID</th>
                                <th sec:authorize="hasRole('ADMIN')">Account</th>
                                <th>Delivery Address</th>
                                <th>Items</th>
                                <th>Total</th>
                                <th>Status</th>
                                <th>Date</th>
                                <th class="text-center">Invoice</th>
                                <th class="pe-4 text-center">Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="o : ${orders}">
                                <td class="ps-4 text-muted font-monospace" th:text="'#' + ${o.id}"></td>

                                <td sec:authorize="hasRole('ADMIN')">
                                    <span class="badge bg-light text-dark border" th:text="${o.user != null ? o.user.username : 'Guest'}"></span>
                                </td>

                                <td>
                                    <div class="address-box">
                                        <div class="fw-bold" th:text="${o.fullName}">Jméno</div>
                                        <div th:text="${o.address}">Ulice</div>
                                        <div th:text="${o.zipCode} + ' ' + ${o.city}">PSČ Město</div>
                                        <div class="small text-primary" th:text="${o.email}">email@test.cz</div>

                                        <div th:if="${o.isCompany}" class="company-info small">
                                            <span class="d-block" th:text="'🏢 ' + ${o.companyName}">Firma</span>
                                            <span th:text="'IČ: ' + ${o.ic}"></span>
                                            <span th:if="${o.dic}" th:text="' DIČ: ' + ${o.dic}"></span>
                                        </div>
                                    </div>
                                </td>

                                <td>
                                    <div th:each="item : ${o.items}">
                                        <span class="fw-bold text-dark" th:text="${item.coffee != null ? item.coffee.name : 'Unknown'}"></span>
                                        <span class="text-muted" th:text="' ' + ${item.quantity} + 'x'"></span>
                                    </div>
                                </td>

                                <td>
                                    <span class="fw-bold text-dark" th:text="${o.totalPrice} + ' CZK'"></span>
                                    <div class="small text-muted" th:text="${o.paymentMethod}">CARD</div>
                                </td>

                                <td>
                                    <span th:text="${o.status}"
                                          th:classappend="${o.status == 'COMPLETED' ? 'bg-success text-white' : 'bg-warning text-dark'}"
                                          class="badge badge-status">
                                    </span>
                                </td>

                                <td class="text-muted">
                                    <span th:text="${o.orderDate != null ? #temporals.format(o.orderDate, 'dd.MM.yyyy HH:mm') : 'N/A'}"></span>
                                </td>

                                <td class="text-center">
                                    <a th:href="@{/orders/invoice/generate/{id}(id=${o.id})}" class="btn btn-outline-danger btn-sm px-2">
                                        PDF 📥
                                    </a>
                                </td>

                                <td class="pe-4 text-center">
                                    <a th:href="@{/orders/delete/{id}(id=${o.id})}"
                                       class="text-danger"
                                       onclick="return confirm('Delete this order?')">
                                        <span title="Delete" style="font-size: 1.1rem;">🗑️</span>
                                    </a>
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(orders)}">
                                <td th:colspan="${#authorization.expression('hasRole(''ADMIN'')') ? 9 : 8}" class="text-center empty-state">
                                    <div class="text-muted">
                                        <span class="display-5 d-block mb-2">📭</span>
                                        <p>No orders found in history.</p>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="card-footer bg-white p-3 d-flex justify-content-between align-items-center">
                    <a th:href="@{/menu}" class="btn btn-secondary btn-sm px-3">
                        🏠 Main Menu
                    </a>
                    <div class="text-muted small">
                        Logged in: <span class="fw-bold" th:text="${#authentication.name}">User</span>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
