
<!DOCTYPE html>
<html lang="cs"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Správa pražíren | Kávový sklad</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/coffee-theme.css}">

    <style>
        body {
            background: #f8f5ef !important;
            color: #30251e;
        }

        .page-container {
            padding: 30px 24px 40px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .section-card {
            border: none;
            border-radius: 16px;
            overflow: hidden;
        }

        .section-card .card-header {
            padding: 16px 20px;
        }

        .section-card .card-header h2 {
            font-size: 18px;
            font-weight: 600;
            margin: 0;
        }

        .form-label {
            font-size: 14px;
            font-weight: 600;
        }

        .form-control,
        .form-select {
            min-height: 42px;
            border-radius: 9px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #a17b58;
            box-shadow: 0 0 0 0.2rem rgba(161, 123, 88, 0.15);
        }

        .save-button {
            min-height: 44px;
            font-weight: 600;
            border-radius: 9px;
        }

        .filter-label {
            font-size: 12px;
            font-weight: 700;
            color: #81766e;
            margin-bottom: 5px;
        }

        .filter-card .card-body {
            padding: 18px;
        }

        .d-none-filtered {
            display: none !important;
        }

        .roastery-table {
            font-size: 14px;
        }

        .roastery-table th {
            white-space: nowrap;
        }

        .roastery-table td {
            overflow-wrap: anywhere;
        }

        .sort-btn {
            cursor: pointer;
            border: none;
            background: transparent;
            color: #6c757d;
            padding: 4px 6px;
            font-size: 16px;
        }

        .sort-btn:hover {
            color: #0d6efd;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .action-buttons .btn {
            min-width: 38px;
            min-height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .website-link {
            text-decoration: none;
            font-size: 18px;
        }

        .mobile-label {
            display: none;
        }

        .empty-message {
            text-align: center;
            padding: 30px 15px !important;
            color: #81766e;
        }

        @media (max-width: 991.98px) {
            .page-container {
                padding: 22px 16px 35px;
            }

            .page-title {
                font-size: 25px;
            }

            .section-card {
                margin-bottom: 20px;
            }
        }

        @media (max-width: 767.98px) {
            .page-container {
                padding: 18px 12px 30px;
            }

            .page-title {
                font-size: 23px;
                margin-bottom: 18px;
            }

            .section-card {
                border-radius: 14px;
            }

            .section-card .card-header {
                padding: 14px 16px;
            }

            .section-card .card-header h2 {
                font-size: 17px;
            }

            .form-control,
            .form-select {
                min-height: 48px;
                font-size: 16px;
            }

            .save-button {
                min-height: 48px;
            }

            .mobile-label {
                display: block;
                font-size: 12px;
                font-weight: 700;
                color: #81766e;
                margin-bottom: 4px;
            }

            .roastery-table,
            .roastery-table tbody,
            .roastery-table tr,
            .roastery-table td {
                display: block;
                width: 100%;
            }

            .roastery-table thead {
                display: none;
            }

            .roastery-table tbody {
                padding: 10px;
            }

            .roastery-table tbody tr.roastery-row {
                background: white;
                border: 1px solid #e6ddd1;
                border-radius: 12px;
                padding: 12px;
                margin-bottom: 12px;
            }

            .roastery-table tbody tr.roastery-row:last-child {
                margin-bottom: 0;
            }

            .roastery-table tbody tr.roastery-row td {
                border: none;
                padding: 6px 2px !important;
                text-align: left !important;
                white-space: normal;
                overflow-wrap: anywhere;
            }

            .roastery-table tbody tr.roastery-row td::before {
                content: attr(data-label);
                display: block;
                font-size: 12px;
                font-weight: 700;
                color: #81766e;
                margin-bottom: 3px;
            }

            .roastery-table tbody tr.roastery-row td:first-child {
                font-size: 17px;
                color: #30251e;
            }

            .roastery-table tbody tr.roastery-row td:first-child::before {
                font-size: 12px;
            }

            .action-buttons {
                justify-content: flex-start;
                margin-top: 5px;
            }

            .action-buttons .btn {
                min-width: 44px;
                min-height: 44px;
            }
        }

        @media (max-width: 360px) {
            .page-container {
                padding-left: 8px;
                padding-right: 8px;
            }

            .section-card .card-body {
                padding-left: 12px;
                padding-right: 12px;
            }

            .roastery-table tbody {
                padding: 8px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg coffee-nav">
    <div class="container-fluid px-4">

        <a class="navbar-brand" th:href="@{/menu}">
            ☕ KÁVOVÝ SKLAD
        </a>

        <div class="d-flex flex-wrap gap-2 align-items-center">

            <a th:href="@{/menu}" class="nav-link">
                Úvod
            </a>

            <a th:href="@{/coffee/all}" class="nav-link">
                Káva
            </a>

            <a th:href="@{/orders/all}" class="nav-link">
                Objednávky
            </a>

            <a sec:authorize="hasRole('ADMIN')"
               th:href="@{/dashboard}"
               class="nav-link">
                Dashboard
            </a>

            <a sec:authorize="hasRole('ADMIN')"
               th:href="@{/roasteries}"
               class="nav-link">
                Pražírny
            </a>

            <a sec:authorize="hasRole('ADMIN')"
               th:href="@{/admin/users}"
               class="nav-link">
                Správa
            </a>

            <form th:action="@{/logout}" method="post">
                <button
                        type="submit"
                        class="btn btn-sm btn-outline-light">
                    Odhlásit
                </button>
            </form>

        </div>
    </div>
</nav>

<main class="container-fluid page-container">

    <h1 class="page-title">
        🏬 Správa pražíren
    </h1>

    <div class="row g-4">

        <div class="col-lg-3">

            <div
                    class="card shadow-sm section-card mb-4"
                    sec:authorize="hasRole('ADMIN')"
                    th:if="${roastery != null}">

                <div class="card-header bg-primary text-white">

                    <h2
                            th:text="${roastery.id == null ? '➕ Přidat pražírnu' : '✏️ Upravit pražírnu'}">
                        Přidat pražírnu
                    </h2>

                </div>

                <div class="card-body p-3">

                    <form
                            th:action="@{/roastery/save}"
                            th:object="${roastery}"
                            method="post">

                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">

                            <label
                                    for="roasteryName"
                                    class="form-label">
                                Název pražírny
                            </label>

                            <input
                                    type="text"
                                    id="roasteryName"
                                    th:field="*{name}"
                                    class="form-control"
                                    required>
                        </div>

                        <div class="mb-3">

                            <label
                                    for="roasteryCountry"
                                    class="form-label">
                                Země
                            </label>

                            <input
                                    type="text"
                                    id="roasteryCountry"
                                    th:field="*{country}"
                                    class="form-control"
                                    required>
                        </div>

                        <div class="mb-3">

                            <label
                                    for="roasteryAddress"
                                    class="form-label">
                                Adresa
                            </label>

                            <input
                                    type="text"
                                    id="roasteryAddress"
                                    th:field="*{address}"
                                    class="form-control">
                        </div>

                        <div class="mb-3">

                            <label
                                    for="roasteryWebsite"
                                    class="form-label">
                                Webové stránky
                            </label>

                            <input
                                    type="url"
                                    id="roasteryWebsite"
                                    th:field="*{website}"
                                    class="form-control"
                                    placeholder="https://example.com">
                        </div>

                        <button
                                type="submit"
                                class="btn save-button w-100"
                                th:classappend="${roastery.id == null ? 'btn-success' : 'btn-warning'}"
                                th:text="${roastery.id == null ? 'Uložit pražírnu' : 'Uložit změny'}">
                            Uložit
                        </button>

                        <a
                                th:if="${roastery.id != null}"
                                th:href="@{/roasteries}"
                                class="btn btn-link w-100 mt-2 text-muted">
                            Zrušit úpravy
                        </a>

                    </form>

                </div>
            </div>

        </div>

        <div class="col-lg-6">

            <div class="card shadow-sm section-card">

                <div class="card-header bg-dark text-white">

                    <h2>☕ Seznam pražíren</h2>

                </div>

                <div class="card-body p-0">

                    <div class="table-responsive">

                        <table
                                class="table table-hover align-middle mb-0 roastery-table"
                                id="roasteryTable">

                            <thead class="table-light">

                            <tr>

                                <th class="ps-3">
                                    Název
                                    <button
                                            type="button"
                                            class="sort-btn"
                                            onclick="sortRoasteries(0)"
                                            aria-label="Seřadit podle názvu">
                                        ↕
                                    </button>
                                </th>

                                <th>
                                    Země
                                    <button
                                            type="button"
                                            class="sort-btn"
                                            onclick="sortRoasteries(1)"
                                            aria-label="Seřadit podle země">
                                        ↕
                                    </button>
                                </th>

                                <th>
                                    Adresa
                                    <button
                                            type="button"
                                            class="sort-btn"
                                            onclick="sortRoasteries(2)"
                                            aria-label="Seřadit podle adresy">
                                        ↕
                                    </button>
                                </th>

                                <th>Web</th>

                                <th
                                        sec:authorize="hasRole('ADMIN')"
                                        class="text-center">
                                    Akce
                                </th>

                            </tr>

                            </thead>

                            <tbody id="roasteryTableBody">

                            <tr
                                    th:each="r : ${roasteries}"
                                    class="roastery-row">

                                <td
                                        data-label="Název"
                                        class="fw-bold ps-3 col-name"
                                        th:text="${r.name}">
                                    Pražírna
                                </td>

                                <td
                                        data-label="Země"
                                        class="col-country"
                                        th:text="${r.country}">
                                    Česká republika
                                </td>

                                <td
                                        data-label="Adresa"
                                        class="col-address text-muted"
                                        th:text="${r.address != null and r.address != '' ? r.address : '---'}">
                                    ---
                                </td>

                                <td
                                        data-label="Web"
                                        class="col-website text-center">

                                    <a
                                            th:if="${r.website != null and !#strings.isEmpty(r.website)}"
                                            th:href="${r.website}"
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            class="website-link"
                                            aria-label="Otevřít web pražírny">
                                        🌐 Otevřít
                                    </a>

                                    <span
                                            th:unless="${r.website != null and !#strings.isEmpty(r.website)}"
                                            class="text-muted">
                                        ---
                                    </span>

                                </td>

                                <td
                                        sec:authorize="hasRole('ADMIN')"
                                        data-label="Akce">

                                    <div class="action-buttons">

                                        <a
                                                th:href="@{/roastery/edit/{id}(id=${r.id})}"
                                                class="btn btn-sm btn-light"
                                                title="Upravit pražírnu"
                                                aria-label="Upravit pražírnu">
                                            ✏️
                                        </a>

                                        <form
                                                th:action="@{/roastery/delete/{id}(id=${r.id})}"
                                                method="post"
                                                onsubmit="return confirm('Pražírnu lze smazat pouze bez přiřazených káv. Pokračovat?')">

                                            <button
                                                    type="submit"
                                                    class="btn btn-sm btn-light text-danger"
                                                    title="Smazat pražírnu"
                                                    aria-label="Smazat pražírnu">
                                                🗑️
                                            </button>

                                        </form>

                                    </div>

                                </td>

                            </tr>

                            <tr th:if="${roasteries == null or #lists.isEmpty(roasteries)}">
                                <td
                                        colspan="5"
                                        class="empty-message">
                                    Zatím nejsou evidovány žádné pražírny.
                                </td>
                            </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

        <div class="col-lg-3">

            <div class="card shadow-sm section-card filter-card">

                <div class="card-header bg-secondary text-white">

                    <h2>🔎 Filtrování</h2>

                </div>

                <div class="card-body">

                    <div class="mb-3">

                        <label
                                for="filterName"
                                class="filter-label">
                            Název pražírny
                        </label>

                        <input
                                type="search"
                                id="filterName"
                                class="form-control"
                                placeholder="Hledat název..."
                                oninput="runRoasteryFilters()">
                    </div>

                    <div class="mb-3">

                        <label
                                for="filterCountry"
                                class="filter-label">
                            Země
                        </label>

                        <input
                                type="search"
                                id="filterCountry"
                                class="form-control"
                                placeholder="Hledat zemi..."
                                oninput="runRoasteryFilters()">
                    </div>

                    <div class="mb-3">

                        <label
                                for="filterAddress"
                                class="filter-label">
                            Adresa
                        </label>

                        <input
                                type="search"
                                id="filterAddress"
                                class="form-control"
                                placeholder="Hledat adresu..."
                                oninput="runRoasteryFilters()">
                    </div>

                    <div class="mb-3">

                        <label
                                for="filterHasWeb"
                                class="filter-label">
                            Webové stránky
                        </label>

                        <select
                                id="filterHasWeb"
                                class="form-select"
                                onchange="runRoasteryFilters()">

                            <option value="all">
                                Všechny pražírny
                            </option>

                            <option value="yes">
                                Pouze s webem
                            </option>

                            <option value="no">
                                Pouze bez webu
                            </option>

                        </select>
                    </div>

                    <button
                            type="button"
                            class="btn btn-outline-secondary w-100"
                            onclick="resetRoasteryFilters()">
                        Vymazat filtry
                    </button>

                    <div class="d-md-none mt-4">

                        <label
                                for="mobileSort"
                                class="filter-label">
                            Seřadit pražírny
                        </label>

                        <select
                                id="mobileSort"
                                class="form-select"
                                onchange="sortRoasteriesMobile(this.value)">

                            <option value="">
                                Výchozí pořadí
                            </option>

                            <option value="0-asc">
                                Název A–Z
                            </option>

                            <option value="0-desc">
                                Název Z–A
                            </option>

                            <option value="1-asc">
                                Země A–Z
                            </option>

                            <option value="1-desc">
                                Země Z–A
                            </option>

                        </select>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>

<script>
    function runRoasteryFilters() {
        const nameVal = document
            .getElementById('filterName')
            .value.trim().toLocaleLowerCase('cs');

        const countryVal = document
            .getElementById('filterCountry')
            .value.trim().toLocaleLowerCase('cs');

        const addressVal = document
            .getElementById('filterAddress')
            .value.trim().toLocaleLowerCase('cs');

        const webVal = document
            .getElementById('filterHasWeb')
            .value;

        const rows = document.querySelectorAll('.roastery-row');

        rows.forEach(row => {
            const name = row
                .querySelector('.col-name')
                .textContent.toLocaleLowerCase('cs');

            const country = row
                .querySelector('.col-country')
                .textContent.toLocaleLowerCase('cs');

            const address = row
                .querySelector('.col-address')
                .textContent.toLocaleLowerCase('cs');

            const hasWeb =
                row.querySelector('.col-website a') !== null;

            const matchName = name.includes(nameVal);
            const matchCountry = country.includes(countryVal);
            const matchAddress = address.includes(addressVal);

            let matchWeb = true;

            if (webVal === 'yes') {
                matchWeb = hasWeb;
            }

            if (webVal === 'no') {
                matchWeb = !hasWeb;
            }

            const matches =
                matchName &&
                matchCountry &&
                matchAddress &&
                matchWeb;

            row.classList.toggle('d-none-filtered', !matches);
        });
    }

    function resetRoasteryFilters() {
        document.getElementById('filterName').value = '';
        document.getElementById('filterCountry').value = '';
        document.getElementById('filterAddress').value = '';
        document.getElementById('filterHasWeb').value = 'all';

        runRoasteryFilters();
    }

    let sortOrder = 1;
    let lastColumn = -1;

    function applyRoasterySort(columnIndex, direction) {
        const tableBody =
            document.getElementById('roasteryTableBody');

        const rows = Array.from(
            tableBody.querySelectorAll('.roastery-row')
        );

        rows.sort((a, b) => {
            const valA = a.cells[columnIndex]
                .textContent.trim();

            const valB = b.cells[columnIndex]
                .textContent.trim();

            return valA.localeCompare(
                valB,
                'cs',
                { sensitivity: 'base' }
            ) * direction;
        });

        rows.forEach(row => tableBody.appendChild(row));
    }

    function sortRoasteries(columnIndex) {
        if (lastColumn === columnIndex) {
            sortOrder *= -1;
        } else {
            sortOrder = 1;
            lastColumn = columnIndex;
        }

        applyRoasterySort(columnIndex, sortOrder);
    }

    function sortRoasteriesMobile(value) {
        if (!value) {
            return;
        }

        const parts = value.split('-');
        const columnIndex = Number(parts[0]);
        const direction = parts[1] === 'desc' ? -1 : 1;

        applyRoasterySort(columnIndex, direction);
    }
</script>

</body>
</html>
