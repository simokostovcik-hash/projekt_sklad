<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Coffee Inventory | Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container-fluid mt-5">
    <div class="row">
        <div class="col-md-3">
            <div class="card shadow border-0 mb-4" sec:authorize="hasRole('ADMIN')">
                <div class="card-header bg-primary text-white p-3">
                    <h3 class="mb-0" th:text="${coffee.id == null ? '➕ Add Coffee' : '✏️ Edit Coffee'}"></h3>
                </div>
                <div class="card-body p-3">
                    <form th:action="@{/coffee/save}" th:object="${coffee}" method="post">
                        <input type="hidden" th:field="*{id}">
                        <div class="mb-2">
                            <label class="form-label small fw-bold">Name:</label>
                            <input type="text" th:field="*{name}" class="form-control form-control-sm" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-bold">Roastery:</label>
                            <select th:field="*{roastery}" class="form-select form-select-sm">
                                <option value="">-- Select --</option>
                                <option th:each="r : ${allRoasteries}" th:value="${r.id}" th:text="${r.name}"></option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-bold">Flavor Tags:</label>
                            <input type="text" name="tagNames" class="form-control form-control-sm" placeholder="e.g. Chocolate"
                                   th:value="${coffee.tags != null and !coffee.tags.isEmpty()} ? ${#strings.listJoin(coffee.tags.![name], ', ')} : ''">
                        </div>
                        <div class="row g-2">
                            <div class="col-6 mb-2">
                                <label class="form-label small fw-bold">Stock:</label>
                                <input type="number" th:field="*{quantity}" class="form-control form-control-sm">
                            </div>
                            <div class="col-6 mb-2">
                                <label class="form-label small fw-bold">Price:</label>
                                <input type="number" step="0.1" th:field="*{price}" class="form-control form-control-sm">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success btn-sm w-100 mt-2 shadow-sm">Save Coffee</button>
                    </form>
                </div>
            </div>

            <div class="mt-2 text-center">
                <a th:href="@{/orders/all}" class="btn btn-info btn-sm w-100 mb-2 shadow-sm text-white">📑 My Orders</a>
                <div sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/roasteries}" class="btn btn-outline-primary btn-sm w-100 mb-2 shadow-sm">🏬 Manage Roasteries</a>
                    <a th:href="@{/admin/users}" class="btn btn-outline-dark btn-sm w-100 mb-2 shadow-sm">👥 Manage Users</a>
                </div>
                <a th:href="@{/menu}" class="btn btn-secondary btn-sm w-100 shadow-sm">🏠 Main Menu</a>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow border-0">
                <div class="card-header bg-dark text-white p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <h3 class="mb-0">📦 Coffee Inventory</h3>
                        <span class="badge bg-info" th:text="'Total Value: ' + ${#numbers.formatDecimal(total, 1, 2)} + ' CZK'"></span>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0 table-sm-text" id="mainTable">
                            <thead class="table-light">
                            <tr>
                                <th class="ps-3">Name <i class="sort-btn" onclick="sortTable(0, 'text', this)">↕</i></th>
                                <th>Roastery <i class="sort-btn" onclick="sortTable(1, 'text', this)">↕</i></th>
                                <th>In Stock <i class="sort-btn" onclick="sortTable(2, 'num', this)">↕</i></th>
                                <th>Price <i class="sort-btn" onclick="sortTable(3, 'num', this)">↕</i></th>
                                <th class="text-center">Action</th>
                            </tr>
                            </thead>
                            <tbody id="tableBody">
                            <tr th:each="c : ${coffeeList}" class="coffee-row"
                                th:data-roastery="${c.roastery != null ? c.roastery.name : ''}"
                                th:data-tags="${c.tags != null and !c.tags.isEmpty() ? #strings.listJoin(c.tags.![name], ',') : ''}"
                                th:data-qty="${c.quantity}">
                                <td class="ps-3">
                                    <div class="fw-bold col-name" th:text="${c.name}"></div>
                                    <div class="tags-container">
                                        <span th:each="t : ${c.tags}" class="badge bg-light text-dark border tag-badge" th:text="${t.name}"></span>
                                    </div>
                                </td>
                                <td th:text="${c.roastery != null ? c.roastery.name : '---'}" class="col-roastery"></td>
                                <td class="col-qty"><span th:text="${c.quantity}"></span> pcs</td>
                                <td class="col-price fw-bold text-dark"><span th:text="${c.price}"></span> CZK</td>
                                <td class="text-center">
                                    <div class="btn-group">
                                        <button th:if="${c.quantity > 0}" type="button"
                                                class="btn btn-sm btn-success shadow-sm buy-button"
                                                th:data-id="${c.id}"
                                                th:data-name="${c.name}"
                                                th:data-price="${c.price}"
                                                onclick="handleBuyClick(this)">
                                            🛒 Buy
                                        </button>
                                        <span th:if="${c.quantity <= 0}" class="badge bg-secondary p-2">Sold Out</span>
                                        <span sec:authorize="hasRole('ADMIN')" class="d-flex ms-1">
                                            <a th:href="@{/coffee/edit/{id}(id=${c.id})}" class="btn btn-sm btn-light border">✏️</a>
                                            <a th:href="@{/coffee/delete/{id}(id=${c.id})}" class="btn btn-sm btn-outline-danger ms-1"
                                               onclick="return confirm('Delete?')">🗑️</a>
                                        </span>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow border-0">
                <div class="card-header bg-secondary text-white p-3">
                    <h3 class="mb-0">🔍 Filters</h3>
                </div>
                <div class="card-body p-3">
                    <div class="mb-3">
                        <label class="filter-label">Search Name</label>
                        <input type="text" id="filterGeneral" class="form-control form-control-sm" onkeyup="runFilters()">
                    </div>
                    <div class="mb-3">
                        <label class="filter-label">Roastery</label>
                        <select id="filterRoastery" class="form-select form-select-sm" onchange="runFilters()">
                            <option value="">All Roasteries</option>
                            <option th:each="r : ${allRoasteries}" th:value="${r.name}" th:text="${r.name}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="filter-label">Min Stock <span id="qVal" class="range-value">0</span></label>
                        <input type="range" id="filterQty" class="form-range" min="0" max="100" value="0" oninput="updateQty(this.value)">
                    </div>
                    <div class="mb-3">
                        <label class="filter-label">Max Price <span id="pVal" class="range-value">5000</span></label>
                        <input type="range" id="filterPrice" class="form-range" min="0" max="5000" step="10" value="5000" oninput="updatePrice(this.value)">
                    </div>
                    <button class="btn btn-sm btn-outline-secondary w-100" onclick="resetAll()">Reset All</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="checkoutModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-dark text-white p-3">
                <h5 class="modal-title">Finalize Order: <span id="modalCoffeeName" class="text-info"></span></h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/orders/confirm}" method="post">
                <div class="modal-body p-4">
                    <input type="hidden" name="coffeeId" id="modalCoffeeId">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="filter-label">Full Name</label>
                            <input type="text" name="fullName" class="form-control form-control-sm" required>
                        </div>
                        <div class="col-md-6">
                            <label class="filter-label">Email</label>
                            <input type="email" name="email" class="form-control form-control-sm" required>
                        </div>
                        <div class="col-12">
                            <label class="filter-label">Address</label>
                            <input type="text" name="address" class="form-control form-control-sm" placeholder="Street and No." required>
                        </div>
                        <div class="col-md-8">
                            <label class="filter-label">City</label>
                            <input type="text" name="city" class="form-control form-control-sm" required>
                        </div>
                        <div class="col-md-4">
                            <label class="filter-label">ZIP Code</label>
                            <input type="text" name="zipCode" class="form-control form-control-sm" required>
                        </div>
                        <div class="col-md-6">
                            <label class="filter-label">Payment</label>
                            <select name="paymentMethod" class="form-select form-select-sm">
                                <option value="CARD">Credit Card</option>
                                <option value="TRANSFER">Bank Transfer</option>
                                <option value="CASH">Cash on Delivery</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="filter-label">Quantity</label>
                            <input type="number" name="quantity" id="modalQuantity" value="1" min="1" class="form-control form-control-sm" oninput="updateModalTotal()">
                        </div>
                    </div>
                    <div class="form-check form-switch mt-3 mb-2">
                        <input class="form-check-input" type="checkbox" id="companySwitch" name="isCompany" onchange="toggleModalCompany()">
                        <label class="form-check-label small fw-bold" for="companySwitch">Purchase for a Company</label>
                    </div>
                    <div id="modalCompanyFields" style="display: none;" class="p-3 bg-light border rounded mb-3">
                        <div class="mb-2">
                            <label class="filter-label">Company Name</label>
                            <input type="text" name="companyName" class="form-control form-control-sm">
                        </div>
                        <div class="row">
                            <div class="col-6"><label class="filter-label">IČO</label><input type="text" name="ic" class="form-control form-control-sm"></div>
                            <div class="col-6"><label class="filter-label">DIČ</label><input type="text" name="dic" class="form-control form-control-sm"></div>
                        </div>
                    </div>
                    <div class="bg-primary text-white p-2 rounded mt-3 d-flex justify-content-between align-items-center">
                        <span class="small ps-2">TOTAL PRICE:</span>
                        <span class="h5 mb-0 pe-2"><span id="modalTotalPrice">0</span> CZK</span>
                    </div>
                </div>
                <div class="modal-footer p-3 bg-light">
                    <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-sm btn-success px-4">Place Order</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    let sorts = {};
    let currentCoffeePrice = 0;

    function handleBuyClick(button) {
        const id = button.getAttribute('data-id');
        const name = button.getAttribute('data-name');
        const price = parseFloat(button.getAttribute('data-price'));
        openCheckout(id, name, price);
    }

    function openCheckout(id, name, price) {
        currentCoffeePrice = price;
        document.getElementById('modalCoffeeId').value = id;
        document.getElementById('modalCoffeeName').innerText = name;
        document.getElementById('modalQuantity').value = 1;
        updateModalTotal();
        document.getElementById('companySwitch').checked = false;
        document.getElementById('modalCompanyFields').style.display = 'none';
        let modalElement = document.getElementById('checkoutModal');
        let checkoutModal = bootstrap.Modal.getInstance(modalElement) || new bootstrap.Modal(modalElement);
        checkoutModal.show();
    }

    function updateModalTotal() {
        const qty = document.getElementById('modalQuantity').value;
        const total = qty * currentCoffeePrice;
        document.getElementById('modalTotalPrice').innerText = total.toFixed(2);
    }

    function toggleModalCompany() {
        const fields = document.getElementById('modalCompanyFields');
        fields.style.display = document.getElementById('companySwitch').checked ? 'block' : 'none';
    }

    function updatePrice(v) { document.getElementById('pVal').innerText = v; runFilters(); }
    function updateQty(v) { document.getElementById('qVal').innerText = v; runFilters(); }

    function runFilters() {
        const q = document.getElementById('filterGeneral').value.toLowerCase();
        const r = document.getElementById('filterRoastery').value;
        const minQty = parseInt(document.getElementById('filterQty').value);
        const maxP = parseFloat(document.getElementById('filterPrice').value);
        document.querySelectorAll('.coffee-row').forEach(row => {
            const name = row.querySelector('.col-name').textContent.toLowerCase();
            const roastery = row.getAttribute('data-roastery');
            const qty = parseInt(row.getAttribute('data-qty'));
            const priceText = row.querySelector('.col-price').textContent.replace(/[^\d.]/g, '');
            const price = parseFloat(priceText);
            const matchQuery = name.includes(q);
            const matchRoastery = r === "" || roastery === r;
            const matchStock = qty >= minQty;
            const matchPrice = price <= maxP;
            row.classList.toggle('d-none-filtered', !(matchQuery && matchRoastery && matchStock && matchPrice));
        });
    }

    function resetAll() {
        document.getElementById('filterGeneral').value = '';
        document.getElementById('filterRoastery').value = '';
        document.getElementById('filterQty').value = 0;
        document.getElementById('filterPrice').value = 5000;
        updateQty(0); updatePrice(5000);
        runFilters();
    }

    function sortTable(idx, type, btn) {
        const body = document.getElementById('tableBody');
        const rows = Array.from(body.querySelectorAll('.coffee-row'));
        let dir = sorts[idx] === 'asc' ? 'desc' : 'asc';
        sorts = { [idx]: dir };
        document.querySelectorAll('.sort-btn').forEach(b => b.innerText = '↕');
        btn.innerText = (dir === 'asc' ? '↑' : '↓');
        rows.sort((a, b) => {
            let vA = a.cells[idx].innerText.trim();
            let vB = b.cells[idx].innerText.trim();
            if (type === 'num') {
                vA = parseFloat(vA.replace(/[^\d.]/g, '')) || 0;
                vB = parseFloat(vB.replace(/[^\d.]/g, '')) || 0;
            } else { vA = vA.toLowerCase(); vB = vB.toLowerCase(); }
            return dir === 'asc' ? (vA > vB ? 1 : -1) : (vA < vB ? 1 : -1);
        });
        rows.forEach(r => body.appendChild(r));
    }
</script>
</body>
</html>
