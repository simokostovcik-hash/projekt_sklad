<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Coffee Inventory | Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container-fluid { padding: 0 30px; }
        .d-none-filtered { display: none !important; }
        .card-header h3 { font-size: 1.15rem; }
        .table-sm-text { font-size: 0.85rem; }
        .filter-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; color: #6c757d; margin-bottom: 5px; display: block; }
        .sort-btn { cursor: pointer; border: none; background: none; padding: 0 5px; color: #adb5bd; transition: color 0.2s; font-style: normal; }
        .sort-btn:hover { color: #0d6efd; }
        th { white-space: nowrap; }
        .range-value { font-weight: bold; color: #0d6efd; float: right; }
        .tag-badge { font-size: 0.7rem; margin-right: 2px; }
        .tags-container { margin-top: 4px; }
    </style>
</head>
<body class="bg-light">

<div class="container-fluid mt-5">
    <div class="row">
        <div class="col-md-3">
            <div class="card shadow border-0 mb-4" sec:authorize="hasRole('ADMIN')">
                <div class="card-header bg-primary text-white p-3">
                    <h3 class="mb-0" th:text="${coffee.id == null ? '➕ Add Coffee' : '✏️ Edit Coffee'}"></h3>
                </div>
                <div class="card-body p-3">
                    <form th:action="@{/coffee/save}" th:object="${coffee}" method="post">
                        <input type="hidden" th:field="*{id}">
                        <div class="mb-2">
                            <label class="form-label small fw-bold">Name:</label>
                            <input type="text" th:field="*{name}" class="form-control form-control-sm" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-bold">Roastery:</label>
                            <select th:field="*{roastery}" class="form-select form-select-sm">
                                <option value="">-- Select --</option>
                                <option th:each="r : ${allRoasteries}" th:value="${r.id}" th:text="${r.name}"></option>
                            </select>
                        </div>

                        <div class="mb-2">
                            <label class="form-label small fw-bold">Flavor Tags (comma separated):</label>
                            <input type="text" name="tagNames" class="form-control form-control-sm"
                                   placeholder="e.g. Chocolate, Nutty"
                                   th:value="${coffee.tags != null and !coffee.tags.isEmpty()} ? ${#strings.listJoin(coffee.tags.![name], ', ')} : ''">
                        </div>

                        <div class="row g-2">
                            <div class="col-6 mb-2">
                                <label class="form-label small fw-bold">Stock (pcs):</label>
                                <input type="number" th:field="*{quantity}" class="form-control form-control-sm">
                            </div>
                            <div class="col-6 mb-2">
                                <label class="form-label small fw-bold">Price (CZK):</label>
                                <input type="number" step="0.1" th:field="*{price}" class="form-control form-control-sm">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success btn-sm w-100 mt-2 shadow-sm">Save Coffee</button>
                    </form>
                </div>
            </div>

            <div class="mt-2 text-center">
                <a th:href="@{/orders/all}" class="btn btn-info btn-sm w-100 mb-2 shadow-sm text-white">📑 My Orders</a>
                <div sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/roasteries}" class="btn btn-outline-primary btn-sm w-100 mb-2 shadow-sm">🏬 Manage Roasteries</a>
                    <a th:href="@{/admin/users}" class="btn btn-outline-dark btn-sm w-100 mb-2 shadow-sm">👥 Manage Users</a>
                </div>
                <a th:href="@{/menu}" class="btn btn-secondary btn-sm w-100 shadow-sm">🏠 Main Menu</a>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow border-0">
                <div class="card-header bg-dark text-white p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <h3 class="mb-0">📦 Coffee Inventory</h3>
                        <span class="badge bg-info" th:text="'Total Value: ' + ${#numbers.formatDecimal(total, 1, 2)} + ' CZK'"></span>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0 table-sm-text" id="mainTable">
                            <thead class="table-light">
                            <tr>
                                <th class="ps-3">Name <i class="sort-btn" onclick="sortTable(0, 'text', this)">↕</i></th>
                                <th>Roastery <i class="sort-btn" onclick="sortTable(1, 'text', this)">↕</i></th>
                                <th>In Stock <i class="sort-btn" onclick="sortTable(2, 'num', this)">↕</i></th>
                                <th>Price <i class="sort-btn" onclick="sortTable(3, 'num', this)">↕</i></th>
                                <th class="text-center">Action</th>
                            </tr>
                            </thead>
                            <tbody id="tableBody">
                            <tr th:each="c : ${coffeeList}" class="coffee-row"
                                th:data-roastery="${c.roastery != null ? c.roastery.name : ''}"
                                th:data-tags="${c.tags != null and !c.tags.isEmpty() ? #strings.listJoin(c.tags.![name], ',') : ''}"
                                th:data-qty="${c.quantity}">
                                <td class="ps-3">
                                    <div class="fw-bold col-name" th:text="${c.name}"></div>
                                    <div class="tags-container">
                                        <span th:each="t : ${c.tags}" class="badge bg-light text-dark border tag-badge" th:text="${t.name}"></span>
                                    </div>
                                </td>
                                <td th:text="${c.roastery != null ? c.roastery.name : '---'}" class="col-roastery"></td>
                                <td class="col-qty"><span th:text="${c.quantity}"></span> pcs</td>
                                <td class="col-price fw-bold text-dark"><span th:text="${c.price}"></span> CZK</td>
                                <td class="text-center">
                                    <div class="btn-group">
                                        <a th:if="${c.quantity > 0}" th:href="@{/buy/{id}(id=${c.id})}"
                                           class="btn btn-sm btn-success shadow-sm">🛒 Buy</a>

                                        <span th:if="${c.quantity <= 0}" class="badge bg-secondary p-2">Sold Out</span>

                                        <span sec:authorize="hasRole('ADMIN')" class="d-flex ms-1">
                                            <a th:href="@{/coffee/edit/{id}(id=${c.id})}" class="btn btn-sm btn-light border">✏️</a>
                                            <a th:href="@{/coffee/delete/{id}(id=${c.id})}" class="btn btn-sm btn-outline-danger ms-1"
                                               onclick="return confirm('Really delete this coffee?')">🗑️</a>
                                        </span>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow border-0">
                <div class="card-header bg-secondary text-white p-3">
                    <h3 class="mb-0">🔍 Filters</h3>
                </div>
                <div class="card-body p-3">
                    <div class="mb-3">
                        <label class="filter-label">Search Name</label>
                        <input type="text" id="filterGeneral" class="form-control form-control-sm" placeholder="Search..." onkeyup="runFilters()">
                    </div>
                    <div class="mb-3">
                        <label class="filter-label">Roastery</label>
                        <select id="filterRoastery" class="form-select form-select-sm" onchange="runFilters()">
                            <option value="">All Roasteries</option>
                            <option th:each="r : ${allRoasteries}" th:value="${r.name}" th:text="${r.name}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="filter-label">Flavor Tag</label>
                        <select id="filterTag" class="form-select form-select-sm" onchange="runFilters()">
                            <option value="">All Tags</option>
                            <option th:each="t : ${allTags}" th:value="${t.name}" th:text="${t.name}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="filter-label">Min Stock <span id="qVal" class="range-value">0</span> pcs</label>
                        <input type="range" id="filterQty" class="form-range" min="0" max="100" value="0" oninput="updateQty(this.value)">
                    </div>
                    <div class="mb-3">
                        <label class="filter-label">Max Price <span id="pVal" class="range-value">5000</span> CZK</label>
                        <input type="range" id="filterPrice" class="form-range" min="0" max="5000" step="10" value="5000" oninput="updatePrice(this.value)">
                    </div>
                    <button class="btn btn-sm btn-outline-secondary w-100" onclick="resetAll()">Reset All</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let sorts = {};

    function updatePrice(v) { document.getElementById('pVal').innerText = v; runFilters(); }
    function updateQty(v) { document.getElementById('qVal').innerText = v; runFilters(); }

    function runFilters() {
        const q = document.getElementById('filterGeneral').value.toLowerCase();
        const r = document.getElementById('filterRoastery').value;
        const tag = document.getElementById('filterTag').value;
        const minQty = parseInt(document.getElementById('filterQty').value);
        const maxP = parseFloat(document.getElementById('filterPrice').value);

        document.querySelectorAll('.coffee-row').forEach(row => {
            const name = row.querySelector('.col-name').textContent.toLowerCase();
            const roastery = row.getAttribute('data-roastery');
            const rowTags = row.getAttribute('data-tags');
            const qty = parseInt(row.getAttribute('data-qty'));
            const price = parseFloat(row.querySelector('.col-price').textContent.replace(/[^\d.]/g, ''));

            const matchQuery = name.includes(q);
            const matchRoastery = r === "" || roastery === r;
            const matchTag = tag === "" || (rowTags && rowTags.includes(tag));
            const matchStock = qty >= minQty;
            const matchPrice = price <= maxP;

            row.classList.toggle('d-none-filtered', !(matchQuery && matchRoastery && matchTag && matchStock && matchPrice));
        });
    }

    function resetAll() {
        document.getElementById('filterGeneral').value = '';
        document.getElementById('filterRoastery').value = '';
        document.getElementById('filterTag').value = '';
        document.getElementById('filterQty').value = 0;
        document.getElementById('filterPrice').value = 5000;
        updateQty(0); updatePrice(5000);
        runFilters();
    }

    function sortTable(idx, type, btn) {
        const body = document.getElementById('tableBody');
        const rows = Array.from(body.querySelectorAll('.coffee-row'));
        if (rows.length === 0) return;

        let dir = sorts[idx] === 'asc' ? 'desc' : 'asc';
        sorts = { [idx]: dir };

        document.querySelectorAll('.sort-btn').forEach(b => b.innerText = '↕');
        btn.innerText = (dir === 'asc' ? '↑' : '↓');

        rows.sort((a, b) => {
            let vA = a.cells[idx].innerText.trim();
            let vB = b.cells[idx].innerText.trim();
            if (type === 'num') {
                vA = parseFloat(vA.replace(/[^\d.]/g, '')) || 0;
                vB = parseFloat(vB.replace(/[^\d.]/g, '')) || 0;
            } else {
                vA = vA.toLowerCase();
                vB = vB.toLowerCase();
            }
            return dir === 'asc' ? (vA > vB ? 1 : -1) : (vA < vB ? 1 : -1);
        });
        rows.forEach(r => body.appendChild(r));
    }
</script>
</body>
</html>
