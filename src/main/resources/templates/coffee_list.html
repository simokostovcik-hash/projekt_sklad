
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Správa káv | Coffee Minimal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/coffee-theme.css}">

    <style>
        .container-fluid { padding: 0 30px; }
        .d-none-filtered { display: none !important; }
        .card-header h3 { font-size: 1.15rem; }
        .table-sm-text { font-size: 0.85rem; }
        .filter-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #6c757d;
            margin-bottom: 5px;
            display: block;
        }
        .sort-btn {
            cursor: pointer;
            border: none;
            background: none;
            padding: 0 5px;
            color: #adb5bd;
            transition: color 0.2s;
            font-style: normal;
        }
        .sort-btn:hover { color: #0d6efd; }
        th { white-space: nowrap; }
        .range-value {
            font-weight: bold;
            color: #0d6efd;
            float: right;
        }
        .tag-badge { font-size: 0.7rem; margin-right: 2px; }
        .tags-container { margin-top: 4px; }
        .low-stock { background-color: #fff3f3 !important; }
        .out-of-stock {
            background-color: #f8f9fa !important;
            color: #adb5bd;
        }

        body {
            background: #f8f5ef !important;
            color: #30251e;
        }

        .card { border-radius: 18px; overflow: hidden; }

        .card-header.bg-primary,
        .card-header.bg-dark {
            background: #30251e !important;
        }

        .btn-success,
        .btn-primary {
            background: #30251e;
            border-color: #30251e;
        }

        .btn-success:hover,
        .btn-primary:hover {
            background: #a17b58;
            border-color: #a17b58;
        }

        .product-thumb {
            width: 44px;
            height: 44px;
            object-fit: cover;
            border-radius: 10px;
            margin-right: 10px;
        }

        .shop-preview {
            width: 100%;
            max-height: 170px;
            object-fit: cover;
            border-radius: 12px;
            margin-top: 10px;
        }

        .shop-status {
            font-size: .75rem;
            font-weight: 600;
        }

        .mobile-coffee-toggle { display: none; }

        @media (max-width: 767.98px) {
            .container-fluid {
                padding-left: 12px;
                padding-right: 12px;
            }

            .row > [class*="col-md-"] {
                margin-bottom: 16px;
            }

            #mainTable,
            #mainTable tbody,
            #mainTable tr,
            #mainTable td {
                display: block;
                width: 100%;
            }

            #mainTable thead { display: none; }

            #mainTable .coffee-row {
                border: 1px solid #e6ddd1;
                border-radius: 12px;
                margin: 10px;
                padding: 10px;
                background: #fff;
            }

            #mainTable .coffee-row td {
                border: 0;
                padding: 6px 3px !important;
                overflow-wrap: anywhere;
            }

            #mainTable .coffee-row td:first-child {
                padding-right: 38px !important;
                position: relative;
            }

            #mainTable .coffee-row td:not(:first-child) {
                display: none;
            }

            #mainTable .coffee-row.mobile-expanded td:not(:first-child) {
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                gap: 12px;
            }

            #mainTable .coffee-row.mobile-expanded td:not(:first-child)::before {
                content: attr(data-label);
                font-weight: 600;
                flex: 0 0 90px;
            }

            #mainTable .coffee-row.mobile-expanded td:last-child {
                display: block;
            }

            #mainTable .coffee-row.mobile-expanded td:last-child::before {
                display: block;
                margin-bottom: 8px;
            }

            #mainTable .coffee-row .btn-group {
                display: flex;
                flex-wrap: wrap;
                gap: 5px;
                justify-content: flex-start;
            }

            .mobile-coffee-toggle {
                display: inline-flex;
                position: absolute;
                right: 2px;
                top: 3px;
                border: 1px solid #cbbcae;
                background: #fff;
                border-radius: 7px;
                padding: 4px 8px;
            }

            .card-header .badge {
                white-space: normal;
                text-align: right;
            }
        }
    </style>
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg coffee-nav">
    <div class="container-fluid px-4">
        <a class="navbar-brand" th:href="@{/menu}">
            ☕ KÁVOVÝ SKLAD
        </a>

        <div class="d-flex flex-wrap gap-2 align-items-center">
            <a th:href="@{/menu}" class="nav-link">Úvod</a>
            <a th:href="@{/coffee/all}" class="nav-link">Káva</a>
            <a th:href="@{/orders/all}" class="nav-link">Objednávky</a>

            <a sec:authorize="hasRole('ADMIN')"
               th:href="@{/dashboard}"
               class="nav-link">Dashboard</a>

            <a sec:authorize="hasRole('ADMIN')"
               th:href="@{/roasteries}"
               class="nav-link">Pražírny</a>

            <a sec:authorize="hasRole('ADMIN')"
               th:href="@{/admin/users}"
               class="nav-link">Správa</a>

            <form th:action="@{/logout}" method="post">
                <button class="btn btn-sm btn-outline-light"
                        type="submit">
                    Odhlásit
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container-fluid mt-5">
    <div class="row">

        <div class="col-md-3">
            <div class="card shadow border-0 mb-4"
                 sec:authorize="hasRole('ADMIN')">

                <div class="card-header bg-primary text-white p-3">
                    <h3 class="mb-0"
                        th:text="${coffee.id == null ? '➕ Přidat kávu' : '✏️ Upravit kávu'}">
                    </h3>
                </div>

                <div class="card-body p-3">
                    <form th:action="@{/coffee/save}"
                          th:object="${coffee}"
                          method="post">

                        <input type="hidden" th:field="*{id}">

                        <div class="mb-2">
                            <label class="form-label small fw-bold">
                                Název kávy:
                            </label>
                            <input type="text"
                                   th:field="*{name}"
                                   class="form-control form-control-sm"
                                   required>
                        </div>

                        <div class="mb-2">
                            <label class="form-label small fw-bold">
                                Pražírna:
                            </label>
                            <select th:field="*{roastery}"
                                    class="form-select form-select-sm">
                                <option value="">-- Vyber pražírnu --</option>
                                <option th:each="r : ${allRoasteries}"
                                        th:value="${r.id}"
                                        th:text="${r.name}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-2">
                            <label class="form-label small fw-bold">
                                Chuťové štítky (oddělené čárkou):
                            </label>
                            <input type="text"
                                   name="tagNames"
                                   class="form-control form-control-sm"
                                   placeholder="Čokoláda, Oříšky"
                                   th:value="${coffee.tags != null and !coffee.tags.isEmpty()} ? ${#strings.listJoin(coffee.tags.![name], ', ')} : ''">
                        </div>

                        <div class="mb-2">
                            <label class="form-label small fw-bold">
                                Datum pražení:
                            </label>
                            <input type="date"
                                   th:field="*{roastDate}"
                                   class="form-control form-control-sm">
                        </div>

                        <div class="row g-2">
                            <div class="col-6 mb-2">
                                <label class="form-label small fw-bold">
                                    Skladem (ks):
                                </label>
                                <input type="number"
                                       th:field="*{quantity}"
                                       class="form-control form-control-sm">
                            </div>

                            <div class="col-6 mb-2">
                                <label class="form-label small fw-bold">
                                    Cena (Kč):
                                </label>
                                <input type="number"
                                       step="0.01"
                                       th:field="*{price}"
                                       class="form-control form-control-sm">
                            </div>
                        </div>

                        <div class="mb-2">
                            <label class="form-label small fw-bold">
                                Popis pro e-shop:
                            </label>
                            <textarea th:field="*{description}"
                                      class="form-control form-control-sm"
                                      rows="3"
                                      maxlength="2000"></textarea>
                        </div>

                        <div class="mb-2">
                            <label class="form-label small fw-bold">
                                URL fotografie kávy:
                            </label>
                            <input type="url"
                                   th:field="*{imageUrl}"
                                   class="form-control form-control-sm"
                                   placeholder="https://...">

                            <small class="text-muted">
                                Vlož veřejnou HTTPS adresu fotografie.
                                Prázdná hodnota odstraní původní fotografii.
                            </small>

                            <img id="coffeeImagePreview"
                                 class="shop-preview"
                                 alt="Náhled fotografie"
                                 style="display:none">
                        </div>

                        <div class="form-check mb-2">
                            <input type="checkbox"
                                   th:field="*{visibleInShop}"
                                   class="form-check-input">

                            <label class="form-check-label">
                                Zobrazit v zákaznickém e-shopu
                            </label>
                        </div>

                        <button type="submit"
                                class="btn btn-success btn-sm w-100 mt-2 shadow-sm">
                            Uložit kávu
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow border-0">

                <div class="card-header bg-dark text-white p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <h3 class="mb-0">📦 Sklad káv</h3>

                        <span class="badge bg-info"
                              th:text="'Hodnota skladu: ' + ${#numbers.formatDecimal(total, 1, 2)} + ' Kč'">
                        </span>
                    </div>
                </div>

                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0 table-sm-text"
                               id="mainTable">

                            <thead class="table-light">
                            <tr>
                                <th class="ps-3">
                                    Název
                                    <i class="sort-btn"
                                       onclick="sortTable(0, 'text', this)">↕</i>
                                </th>

                                <th>
                                    Pražírna
                                    <i class="sort-btn"
                                       onclick="sortTable(1, 'text', this)">↕</i>
                                </th>

                                <th>
                                    Datum pražení
                                    <i class="sort-btn"
                                       onclick="sortTable(2, 'text', this)">↕</i>
                                </th>

                                <th>
                                    Skladem
                                    <i class="sort-btn"
                                       onclick="sortTable(3, 'num', this)">↕</i>
                                </th>

                                <th>
                                    Cena
                                    <i class="sort-btn"
                                       onclick="sortTable(4, 'num', this)">↕</i>
                                </th>

                                <th class="text-center">Akce</th>
                            </tr>
                            </thead>

                            <tbody id="tableBody">

                            <tr th:each="c : ${coffeeList}"
                                class="coffee-row"
                                th:classappend="${c.quantity == 0} ? 'out-of-stock' : (${c.quantity < 5} ? 'low-stock' : '')"
                                th:data-roastery="${c.roastery != null ? c.roastery.name : ''}"
                                th:data-tags="${c.tags != null and !c.tags.isEmpty() ? #strings.listJoin(c.tags.![name], ',') : ''}"
                                th:data-qty="${c.quantity}"
                                th:data-price="${c.price}">

                                <td class="ps-3">
                                    <div class="d-flex align-items-center">

                                        <img th:if="${c.imageUrl != null and !#strings.isEmpty(c.imageUrl)}"
                                             th:src="${c.imageUrl}"
                                             class="product-thumb"
                                             alt="Fotografie kávy"
                                             loading="lazy">

                                        <div>
                                            <div class="fw-bold col-name"
                                                 th:text="${c.name}"></div>

                                            <button type="button"
                                                    class="mobile-coffee-toggle"
                                                    aria-expanded="false"
                                                    aria-label="Rozbalit detaily kávy"
                                                    onclick="toggleCoffeeDetails(this)">
                                                ＋
                                            </button>

                                            <span th:if="${c.visibleInShop}"
                                                  class="badge bg-success shop-status">
                                                V e-shopu
                                            </span>

                                            <span th:unless="${c.visibleInShop}"
                                                  class="badge bg-secondary shop-status">
                                                Skryto
                                            </span>
                                        </div>
                                    </div>

                                    <div class="tags-container">
                                        <span th:each="t : ${c.tags}"
                                              class="badge bg-light text-dark border tag-badge"
                                              th:text="${t.name}">
                                        </span>
                                    </div>
                                </td>

                                <td data-label="Pražírna"
                                    class="col-roastery"
                                    th:text="${c.roastery != null ? c.roastery.name : '---'}">
                                </td>

                                <td data-label="Pražení"
                                    th:text="${c.roastDate != null ? #temporals.format(c.roastDate, 'dd.MM.yyyy') : 'N/A'}">
                                </td>

                                <td data-label="Skladem" class="col-qty">
                                    <span th:text="${c.quantity}"
                                          class="fw-bold"></span>
                                    ks

                                    <small th:if="${c.quantity > 0 and c.quantity < 5}"
                                           class="text-danger d-block"
                                           style="font-size: 0.65rem;">
                                        NÍZKÝ STAV
                                    </small>
                                </td>

                                <td data-label="Cena"
                                    class="col-price fw-bold text-dark">
                                    <span th:text="${#numbers.formatDecimal(c.price, 1, 2)}"></span>
                                    Kč
                                </td>

                                <td data-label="Akce" class="text-center">
                                    <div class="btn-group">

                                        <span sec:authorize="hasRole('ADMIN')"
                                              class="d-flex ms-1">

                                            <a th:href="@{/coffee/edit/{id}(id=${c.id})}"
                                               class="btn btn-sm btn-light border"
                                               title="Upravit produkt">
                                                ✏️
                                            </a>

                                            <form th:action="@{/coffee/visibility/{id}(id=${c.id})}"
                                                  method="post"
                                                  class="d-inline">

                                                <button type="submit"
                                                        class="btn btn-sm ms-1"
                                                        th:classappend="${c.visibleInShop} ? 'btn-outline-secondary' : 'btn-outline-success'"
                                                        th:text="${c.visibleInShop} ? 'Skrýt' : 'Zveřejnit'"
                                                        title="Změnit viditelnost v e-shopu">
                                                </button>
                                            </form>

                                            <form th:action="@{/coffee/delete/{id}(id=${c.id})}"
                                                  method="post"
                                                  class="d-inline"
                                                  onsubmit="return confirm('Opravdu smazat kávu v e-shopu?')">

                                                <button type="submit"
                                                        class="btn btn-sm btn-outline-danger ms-1">
                                                    Smazat
                                                </button>
                                            </form>

                                        </span>
                                    </div>
                                </td>
                            </tr>

                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow border-0">

                <div class="card-header bg-secondary text-white p-3">
                    <h3 class="mb-0">🔍 Filtry</h3>
                </div>

                <div class="card-body p-3">

                    <div class="mb-3">
                        <label class="filter-label">Hledat název</label>
                        <input type="text"
                               id="filterGeneral"
                               class="form-control form-control-sm"
                               placeholder="Hledat..."
                               onkeyup="runFilters()">
                    </div>

                    <div class="mb-3">
                        <label class="filter-label">Pražírna</label>
                        <select id="filterRoastery"
                                class="form-select form-select-sm"
                                onchange="runFilters()">

                            <option value="">Všechny pražírny</option>

                            <option th:each="r : ${allRoasteries}"
                                    th:value="${r.name}"
                                    th:text="${r.name}">
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="filter-label">Chuťový štítek</label>
                        <select id="filterTag"
                                class="form-select form-select-sm"
                                onchange="runFilters()">

                            <option value="">Všechny štítky</option>

                            <option th:each="t : ${allTags}"
                                    th:value="${t.name}"
                                    th:text="${t.name}">
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="filter-label">
                            Minimálně skladem:
                            <span id="qVal" class="range-value">0</span>
                            ks
                        </label>

                        <input type="range"
                               id="filterQty"
                               class="form-range"
                               min="0"
                               max="100"
                               value="0"
                               oninput="updateQty(this.value)">
                    </div>

                    <div class="mb-3">
                        <label class="filter-label">
                            Maximální cena:
                            <span id="pVal" class="range-value">5000</span>
                            Kč
                        </label>

                        <input type="range"
                               id="filterPrice"
                               class="form-range"
                               min="0"
                               max="5000"
                               step="10"
                               value="5000"
                               oninput="updatePrice(this.value)">
                    </div>

                    <button class="btn btn-sm btn-outline-secondary w-100"
                            onclick="resetAll()">
                        Resetovat filtry
                    </button>

                </div>
            </div>
        </div>

    </div>
</div>

<script>
    // Rozbalování jednotlivých káv na telefonu
    function toggleCoffeeDetails(button) {
        const row = button.closest('.coffee-row');
        const expanded = row.classList.toggle('mobile-expanded');

        button.setAttribute('aria-expanded', String(expanded));
        button.setAttribute(
            'aria-label',
            expanded ? 'Sbalit detaily kávy' : 'Rozbalit detaily kávy'
        );

        button.textContent = expanded ? '−' : '＋';
    }

    // Náhled fotografie
    const imageInput = document.getElementById('imageUrl');
    const imagePreview = document.getElementById('coffeeImagePreview');

    if (imageInput && imagePreview) {
        const updatePreview = () => {
            const url = imageInput.value.trim();

            imagePreview.style.display =
                /^https:\/\//i.test(url) ? 'block' : 'none';

            if (url) {
                imagePreview.src = url;
            }
        };

        imageInput.addEventListener('input', updatePreview);

        imagePreview.addEventListener('error', () => {
            imagePreview.style.display = 'none';
        });

        updatePreview();
    }

    let sorts = {};

    function updatePrice(v) {
        document.getElementById('pVal').innerText = v;
        runFilters();
    }

    function updateQty(v) {
        document.getElementById('qVal').innerText = v;
        runFilters();
    }

    // Filtrování káv
    function runFilters() {
        const q = document.getElementById('filterGeneral').value.toLowerCase();
        const r = document.getElementById('filterRoastery').value;
        const tag = document.getElementById('filterTag').value;
        const minQty = parseInt(document.getElementById('filterQty').value);
        const maxP = parseFloat(document.getElementById('filterPrice').value);

        document.querySelectorAll('.coffee-row').forEach(row => {
            const name = row.querySelector('.col-name').textContent.toLowerCase();
            const roastery = row.getAttribute('data-roastery');
            const rowTags = row.getAttribute('data-tags');
            const qty = parseInt(row.getAttribute('data-qty'));
            const price = Number(row.dataset.price);

            const matchQuery = name.includes(q);
            const matchRoastery = r === '' || roastery === r;

            const matchTag = tag === '' ||
                (rowTags &&
                    rowTags.split(',').map(t => t.trim()).includes(tag));

            const matchStock = qty >= minQty;
            const matchPrice = price <= maxP;

            row.classList.toggle(
                'd-none-filtered',
                !(matchQuery &&
                    matchRoastery &&
                    matchTag &&
                    matchStock &&
                    matchPrice)
            );
        });
    }

    // Reset filtrů
    function resetAll() {
        document.getElementById('filterGeneral').value = '';
        document.getElementById('filterRoastery').value = '';
        document.getElementById('filterTag').value = '';
        document.getElementById('filterQty').value = 0;
        document.getElementById('filterPrice').value = 5000;

        updateQty(0);
        updatePrice(5000);
        runFilters();
    }

    // Řazení tabulky
    function sortTable(idx, type, btn) {
        const body = document.getElementById('tableBody');
        const rows = Array.from(body.querySelectorAll('.coffee-row'));

        if (rows.length === 0) return;

        const dir = sorts[idx] === 'asc' ? 'desc' : 'asc';
        sorts = { [idx]: dir };

        document.querySelectorAll('.sort-btn').forEach(b => {
            b.innerText = '↕';
        });

        btn.innerText = dir === 'asc' ? '↑' : '↓';

        rows.sort((a, b) => {
            let vA = a.cells[idx].innerText.trim();
            let vB = b.cells[idx].innerText.trim();

            if (type === 'num') {
                vA = parseFloat(vA.replace(/[^\d.]/g, '')) || 0;
                vB = parseFloat(vB.replace(/[^\d.]/g, '')) || 0;
            } else {
                vA = vA.toLowerCase();
                vB = vB.toLowerCase();
            }

            if (vA === vB) return 0;

            return dir === 'asc'
                ? (vA > vB ? 1 : -1)
                : (vA < vB ? 1 : -1);
        });

        rows.forEach(row => body.appendChild(row));
    }
</script>

</body>
</html>
