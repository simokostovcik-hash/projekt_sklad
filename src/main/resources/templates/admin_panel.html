<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel | System Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light p-4">

<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3">System Administration</h1>
    <div class="btn-group shadow-sm">
      <a th:href="@{/coffee/all}" class="btn btn-primary">Inventory</a>
      <a th:href="@{/roasteries}" class="btn btn-info">Roasteries</a>
      <a th:href="@{/menu}" class="btn btn-outline-secondary">Main Menu</a>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-5">
      <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-primary text-white py-3">
          <h5 class="mb-0">User Management</h5>
        </div>
        <div class="card-body p-0">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
            <tr>
              <th class="ps-3">Username</th>
              <th>Role</th>
              <th class="text-end pe-3">Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}">
              <td class="ps-3 fw-bold" th:text="${u.username}"></td>
              <td>
                                <span class="badge"
                                      th:classappend="${u.role == 'ROLE_ADMIN' ? 'bg-danger' : 'bg-info text-dark'}"
                                      th:text="${u.role}"></span>
              </td>
              <td class="text-end pe-3">
                <form th:action="@{/admin/user/update-role}" method="post" class="d-flex justify-content-end gap-1">
                  <input type="hidden" name="userId" th:value="${u.id}" />
                  <select name="newRole" class="form-select form-select-sm" style="width: auto;">
                    <option value="ROLE_USER" th:selected="${u.role == 'ROLE_USER'}">USER</option>
                    <option value="ROLE_ADMIN" th:selected="${u.role == 'ROLE_ADMIN'}">ADMIN</option>
                  </select>
                  <button type="submit" class="btn btn-sm btn-dark">Update</button>
                </form>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="col-lg-7">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-dark text-white py-3">
          <h5 class="mb-0">System Audit Log</h5>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-sm table-striped hover mb-0">
              <thead class="sticky-top border-bottom shadow-sm">
              <tr>
                <th class="ps-3 py-2">Timestamp</th>
                <th class="py-2">User</th>
                <th class="py-2 pe-3">Action Details</th>
              </tr>
              </thead>
              <tbody>
              <tr th:each="log : ${auditLogs}">
                <td class="ps-3" th:text="${log.timestamp != null ? #temporals.format(log.timestamp, 'dd.MM.yyyy HH:mm:ss') : '---'}"></td>
                <td th:text="${log.user}"></td>
                <td th:text="${log.action}"></td>
              </tr>
              <tr th:if="${auditLogs == null or #lists.isEmpty(auditLogs)}">
                <td colspan="3" class="text-center py-5 text-muted">
                  <p class="mb-0">No activity recorded in the audit log.</p>
                </td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
