# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# First create the database and import the existing H2 data.
spring.datasource.url=jdbc:mysql://localhost:3306/projekt_sklad_migrace?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC
spring.datasource.username=projekt_sklad_app
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
