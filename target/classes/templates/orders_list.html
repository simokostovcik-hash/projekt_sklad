
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Orders | Coffee Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/coffee-theme.css}">
    <style>
        .container { max-width: 1200px; }
        .card { border: none; border-radius: 10px; overflow: hidden; }
        .card-header h3 { font-size: 1.25rem; font-weight: 600; }
        .table-sm-text { font-size: 0.9rem; }
        .badge-status {
            font-size: 0.7rem;
            padding: 0.5em 0.8em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-radius: 20px;
        }
        .empty-state { padding: 4rem 0; }
        .back-btn { transition: transform 0.2s; }
        .back-btn:hover { transform: translateX(-3px); }
        .btn-action { padding: 0.25rem 0.5rem; font-size: 0.8rem; }
        @media (max-width: 767px) {
            .container { padding-left: 10px; padding-right: 10px; }
            .table-responsive { overflow-x: auto; }
            .table { min-width: 850px; }
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg coffee-nav">
    <div class="container-fluid px-4">
        <a class="navbar-brand" th:href="@{/menu}">☕ KÁVOVÝ SKLAD</a>
        <div class="d-flex flex-wrap gap-2 align-items-center">
            <a th:href="@{/menu}" class="nav-link">Úvod</a>
            <a th:href="@{/coffee/all}" class="nav-link">Káva</a>
            <a th:href="@{/orders/all}" class="nav-link">Objednávky</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/dashboard}" class="nav-link">Dashboard</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/roasteries}" class="nav-link">Pražírny</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}" class="nav-link">Správa</a>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-sm btn-outline-light" type="submit">Odhlásit</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-12">

            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white p-3 d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center">
                        <span class="fs-4 me-2">📑</span>
                        <h3 class="mb-0">Order History</h3>
                    </div>

                </div>

                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0 table-sm-text">
                            <thead class="table-light text-secondary text-uppercase small">
                            <tr>
                                <th class="ps-4 py-3">Order ID</th>
                                <th class="py-3" sec:authorize="hasRole('ADMIN')">Customer</th>
                                <th class="py-3">Items Purchased</th>
                                <th class="py-3">Total Amount</th>
                                <th class="py-3">Status</th>
                                <th class="py-3">Date &amp; Time</th>
                                <th class="py-3 text-center">Invoice</th>
                                <th class="py-3 pe-4 text-center">Actions</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="o : ${orders}">
                                <td class="ps-4 text-muted font-monospace"
                                    th:text="'#' + ${o.id}">
                                </td>

                                <td sec:authorize="hasRole('ADMIN')">
                                    <span class="badge bg-info text-dark"
                                          th:text="${o.customerName != null and !#strings.isEmpty(o.customerName) ? o.customerName : (o.user != null ? o.user.username : 'Neuvedeno')}">
                                    </span>
                                </td>

                                <td>
                                    <div th:each="item : ${o.items}">
                                        <span class="fw-bold text-dark"
                                              th:text="${item.displayCoffeeName}">
                                        </span>
                                        <span class="text-muted small"
                                              th:text="' (' + ${item.quantity} + 'x)'">
                                        </span>
                                    </div>
                                    <div th:if="${o.items == null or #lists.isEmpty(o.items)}"
                                         class="text-muted fst-italic small">
                                        No items details found
                                    </div>
                                </td>

                                <td>
                                    <span class="fw-bold text-primary"
                                          th:text="${o.totalPrice != null ? o.totalPrice : '0'} + ' CZK'">
                                    </span>
                                </td>

                                <td>
                                    <span th:text="${o.status}"
                                          th:classappend="${o.status == 'COMPLETED' ? 'bg-success text-white' : 'bg-warning text-dark'}"
                                          class="badge badge-status">
                                    </span>
                                    <form sec:authorize="hasRole('ADMIN')"
                                          th:if="${o.status == 'PENDING'}"
                                          th:action="@{/orders/status/{id}(id=${o.id})}"
                                          method="post" class="mt-2">
                                        <input type="hidden" name="status" value="COMPLETED">
                                        <button type="submit" class="btn btn-sm btn-success"
                                                onclick="return confirm('Označit objednávku jako dokončenou?')">
                                            ✓ Dokončit
                                        </button>
                                    </form>
                                </td>

                                <td class="text-muted">
                                    <span th:text="${o.orderDate != null ? #temporals.format(o.orderDate, 'yyyy-MM-dd HH:mm') : 'N/A'}">
                                    </span>
                                </td>

                                <td class="text-center">
                                    <a th:href="@{/orders/invoice/generate/{id}(id=${o.id})}"
                                       class="btn btn-outline-danger btn-sm btn-action">
                                        PDF 📥
                                    </a>
                                </td>

                                <td class="pe-4 text-center">
                                    <form th:action="@{/orders/delete/{id}(id=${o.id})}"
                                          method="post"
                                          onsubmit="return confirm('Opravdu smazat objednávku?')">
                                        <button type="submit"
                                                class="btn btn-outline-danger btn-sm"
                                                title="Smazat objednávku">
                                            🗑️
                                        </button>
                                    </form>
                                </td>
                            </tr>

                            <tr th:if="${orders == null or #lists.isEmpty(orders)}">
                                <td th:colspan="${#authorization.expression('hasRole(''ADMIN'')') ? 8 : 7}"
                                    class="text-center empty-state">
                                    <div class="text-muted">
                                        <span class="display-4 d-block mb-3">🛒</span>
                                        <p class="mb-0">No orders found.</p>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="card-footer bg-white p-3 d-flex justify-content-between align-items-center">


                    <div class="text-muted small" sec:authorize="isAuthenticated()">
                        Logged in as:
                        <span class="fw-bold text-dark"
                              th:text="${#authentication.name}">User</span>
                        <span th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
                              class="badge bg-danger ms-1">
                            ADMIN
                        </span>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
